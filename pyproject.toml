[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "icloud-calendar-mcp"
version = "0.1.0"
description = "MCP server for iCloud (Apple) Calendar over CalDAV"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Hayden Sather" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "mcp>=2.3",
    "caldav>=3.7",
    "icalendar>=6",
    "uvicorn>=0.30",
]

[project.scripts]
icloud-calendar-mcp = "icloud_calendar_mcp.cli:main"

[project.urls]
Repository = "https://github.com/hrsather/icloud-calendar-mcp"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "radicale>=3.2",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-pytz",
]

[tool.hatch.build.targets.wheel]
packages = ["src/icloud_calendar_mcp"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S104", "S105", "S106", "S603"]

[tool.mypy]
strict = true
files = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "--cov=icloud_calendar_mcp --cov-fail-under=90"
